<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#35695b">
  <title>Tradutor de Livros</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/editor.css">
  <link rel="stylesheet" href="./assets/css/preview.css">
  <link rel="stylesheet" href="./assets/css/components.css">
</head>
<body>
  <header class="topbar">
    <strong>Tradutor de Livros</strong>
    <span id="current-book" class="muted">Nenhum livro aberto</span>
    <span class="spacer"></span>
    <span id="save-state" class="muted">Pronto</span>
    <button class="button secondary" id="open-library">Biblioteca</button>
    <button class="button primary" id="new-book">Novo livro</button>
  </header>

  <main>
    <div class="workspace">
      <section class="panel editor-panel">
        <div class="section">
          <h2>Livro</h2>
          <label>Nome<input id="book-name" maxlength="300"></label>
          <div class="grid two">
            <label>Idioma de entrada<select id="source-language"><option value="en">Inglês</option><option value="es">Espanhol</option><option value="fr">Francês</option><option value="de">Alemão</option><option value="it">Italiano</option><option value="auto">Detectar</option></select></label>
            <label>Idioma de saída<select id="target-language"><option value="pt">Português</option><option value="en">Inglês</option><option value="es">Espanhol</option></select></label>
          </div>
          <label>Status<select id="book-status"><option>Em andamento</option><option>Concluido</option></select></label>
        </div>

        <div class="section">
          <div class="toolbar wrap">
            <h2>Conteúdo</h2><span class="spacer"></span>
            <button class="button secondary small" data-add="titulo">+ Título</button>
            <button class="button secondary small" data-add="subtitulo">+ Subtítulo</button>
            <button class="button secondary small" data-add="texto">+ Texto</button>
            <button class="button secondary small" data-add="imagem">+ Imagem</button>
          </div>
          <p class="muted small-text">A tradução é automática. Preencha a revisão somente quando quiser substituir o resultado.</p>
          <div id="blocks" class="blocks"></div>
        </div>
        <button class="button primary" id="save-now">Salvar agora</button>
      </section>

      <section class="panel preview-panel">
        <div class="toolbar preview-tools">
          <strong>Prévia</strong><span class="spacer"></span>
          <button class="button secondary" id="zoom-out">−</button>
          <span id="zoom-value">72%</span>
          <button class="button secondary" id="zoom-in">+</button>
          <button class="button secondary" id="fit-preview">Ajustar</button>
          <button class="button primary" id="download-pdf">Baixar PDF</button>
        </div>
        <div id="preview-stage" class="preview-stage"><div id="preview-pages" class="preview-pages"></div></div>
      </section>
    </div>
  </main>

  <div id="library-backdrop" class="backdrop hidden">
    <aside class="drawer">
      <div class="toolbar"><h2>Biblioteca</h2><span class="spacer"></span><button id="close-library" class="button secondary">Fechar</button></div>
      <input id="library-search" placeholder="Pesquisar por nome">
      <div id="library-list" class="library-list"></div>
    </aside>
  </div>

  <dialog id="new-book-dialog">
    <form method="dialog" id="new-book-form">
      <h2>Novo livro</h2>
      <label>Nome<input id="new-book-name" maxlength="300" required></label>
      <div class="grid two">
        <label>Entrada<select id="new-source"><option value="en">Inglês</option><option value="es">Espanhol</option><option value="fr">Francês</option><option value="de">Alemão</option><option value="it">Italiano</option><option value="auto">Detectar</option></select></label>
        <label>Saída<select id="new-target"><option value="pt">Português</option><option value="en">Inglês</option><option value="es">Espanhol</option></select></label>
      </div>
      <div class="toolbar end"><button value="cancel" class="button secondary">Cancelar</button><button value="default" class="button primary">Criar</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
